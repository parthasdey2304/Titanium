[package]
name = "titanium-rust"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight native Rust port of Titanium Virtual Assistant"
authors = ["Partha Dey"]

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

# Audio & DSP
cpal = "0.15"
rodio = "0.19"
hound = "3.5"

# Windows Native APIs & Transparent Windows
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Media_Audio",
] }

# Logging & Concurrency
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
anyhow = "1.0"
